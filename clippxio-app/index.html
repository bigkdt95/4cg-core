<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClippXio | G4C Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #05070a; 
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(17, 25, 40, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }
        .xray-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }
        .coin-badge {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: #fbbf24;
        }
        .search-ring:focus-within {
            box-shadow: 0 0 0 2px #3b82f6;
        }
    </style>
</head>
<body class="min-h-screen pb-20">
    <!-- Header -->
    <nav class="p-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 xray-gradient rounded-xl flex items-center justify-center">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
            <span class="font-extrabold text-xl tracking-tight">ClippXio</span>
        </div>
        <div class="coin-badge px-4 py-2 rounded-full flex items-center gap-2 font-bold text-sm">
            <span>🪙</span>
            <span>1.250 CXC</span>
        </div>
    </nav>

    <main class="px-6 space-y-8">
        <!-- IA / Mascote Section -->
        <div class="glass-card p-6 flex items-center gap-5">
            <div class="relative">
                <div class="w-16 h-16 bg-blue-500/20 rounded-2xl flex items-center justify-center border border-blue-500/30">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
                </div>
                <div class="absolute -top-1 -right-1 w-4 h-4 bg-green-500 rounded-full border-2 border-[#05070a] animate-pulse"></div>
            </div>
            <div>
                <p class="text-xs font-bold text-blue-400 uppercase tracking-widest mb-1">X-Ray Assistant</p>
                <p class="text-slate-300 text-sm leading-tight">"Encontrei 3 ficheiros de <span class="text-white font-bold">#obra</span> sem etiquetas. Queres tratar disso agora?"</p>
            </div>
        </div>

        <!-- Central de Busca (O Core do Aplicativo) -->
        <div class="space-y-4">
            <div class="search-ring relative glass-card overflow-hidden transition-all">
                <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
                <input type="text" placeholder="Procurar por metadados ou #tags..." 
                       class="w-full bg-transparent p-5 pl-12 outline-none text-white placeholder:text-slate-600">
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                <span class="px-4 py-2 bg-slate-800 rounded-lg text-xs font-semibold text-slate-300">#setor-a</span>
                <span class="px-4 py-2 bg-slate-800 rounded-lg text-xs font-semibold text-slate-300">#urgente</span>
                <span class="px-4 py-2 bg-slate-800 rounded-lg text-xs font-semibold text-slate-300">#concluido</span>
                <span class="px-4 py-2 bg-slate-800 rounded-lg text-xs font-semibold text-slate-300">#referencia</span>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="grid grid-cols-2 gap-4">
            <div class="glass-card p-5 border-b-4 border-blue-500 active:scale-95 transition-transform">
                <div class="mb-3 text-blue-500">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
                </div>
                <h3 class="font-bold text-sm">Novo Index</h3>
                <p class="text-[10px] text-slate-500 mt-1">+50 CXC p/ tag</p>
            </div>
            <div class="glass-card p-5 border-b-4 border-purple-500 active:scale-95 transition-transform">
                <div class="mb-3 text-purple-500">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19 9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                </div>
                <h3 class="font-bold text-sm">Studio Studio</h3>
                <p class="text-[10px] text-slate-500 mt-1">Gerar Reels IA</p>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-6 left-6 right-6 glass-card p-4 flex justify-around items-center border border-white/20 shadow-2xl">
        <div class="text-blue-500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
        <div class="text-slate-500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></div>
        <div class="text-slate-500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
    </div>
</body>
</html>
