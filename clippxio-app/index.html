<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClippXio - G4C Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .coin-glow { filter: drop-shadow(0 0 8px #fbbf24); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header & Moedas -->
        <header class="flex justify-between items-center glass p-4 rounded-2xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-xl">X</div>
                <h1 class="text-xl font-bold tracking-tight">ClippXio</h1>
            </div>
            <div class="flex items-center gap-2 bg-yellow-500/20 px-4 py-2 rounded-full border border-yellow-500/50">
                <span class="text-yellow-400 font-bold coin-glow">🪙</span>
                <span id="balance" class="text-yellow-400 font-bold">1,250 CXC</span>
            </div>
        </header>

        <!-- Mascote & Mensagem IA -->
        <section class="glass p-6 rounded-3xl flex flex-col md:flex-row items-center gap-6 relative overflow-hidden">
            <div class="w-24 h-24 md:w-32 md:h-32 bg-gradient-to-br from-blue-400 to-indigo-600 rounded-full flex items-center justify-center text-5xl shadow-lg shadow-blue-500/20">
                🤖
            </div>
            <div class="flex-1 space-y-2">
                <h2 class="text-blue-400 font-semibold uppercase text-sm tracking-widest">ClippXio AI Assistant</h2>
                <p id="ai-message" class="text-lg text-slate-200 leading-relaxed">"Olá! Vamos organizar os teus ficheiros hoje para ganhar mais moedas?"</p>
                <div class="flex gap-2">
                    <span class="px-2 py-1 bg-blue-500/10 text-blue-400 text-xs rounded border border-blue-500/20">#ativo</span>
                    <span class="px-2 py-1 bg-green-500/10 text-green-400 text-xs rounded border border-green-500/20">#x-ray-on</span>
                </div>
            </div>
        </section>

        <!-- Motor de Busca X-Ray -->
        <section class="space-y-4">
            <div class="relative">
                <input type="text" placeholder="Pesquisar por #tags ou metadados..." 
                       class="w-full bg-slate-800 border-2 border-slate-700 p-4 pl-12 rounded-2xl focus:border-blue-500 outline-none transition-all">
                <span class="absolute left-4 top-4 text-slate-400">🔍</span>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                <button class="whitespace-nowrap px-4 py-2 glass rounded-full text-sm hover:bg-blue-600 transition">#obra</button>
                <button class="whitespace-nowrap px-4 py-2 glass rounded-full text-sm hover:bg-blue-600 transition">#projeto</button>
                <button class="whitespace-nowrap px-4 py-2 glass rounded-full text-sm hover:bg-blue-600 transition">#entrega</button>
                <button class="whitespace-nowrap px-4 py-2 glass rounded-full text-sm hover:bg-blue-600 transition">#fatura</button>
            </div>
        </section>

        <!-- Studio Criativo & Ações -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <button class="glass p-6 rounded-2xl hover:bg-blue-600/20 transition text-left group border-l-4 border-l-blue-500">
                <h3 class="font-bold text-lg flex items-center gap-2">
                    🎬 Studio Criativo <span class="group-hover:translate-x-1 transition">→</span>
                </h3>
                <p class="text-slate-400 text-sm mt-1">Gerar Reels e Cards automaticamente.</p>
            </button>
            <button class="glass p-6 rounded-2xl hover:bg-purple-600/20 transition text-left group border-l-4 border-l-purple-500">
                <h3 class="font-bold text-lg flex items-center gap-2">
                    📂 Indexar Novo <span class="group-hover:translate-x-1 transition">+</span>
                </h3>
                <p class="text-slate-400 text-sm mt-1">Adicionar etiquetas e ganhar CXC.</p>
            </button>
        </div>

    </div>

    <script>
        // Simulação de carregamento de dados do repositório
        console.log("ClippXio v1.0 - Sistema G4C Core Carregado.");
        
        // Função para simular ganho de moedas
        function addCoins(amount) {
            const el = document.getElementById('balance');
            let current = parseInt(el.innerText.replace(',', ''));
            el.innerText = (current + amount).toLocaleString() + ' CXC';
        }
    </script>
</body>
</html>
